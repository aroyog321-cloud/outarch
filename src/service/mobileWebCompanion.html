    // ---------------------------------------------------------------------------
    // Cryptographic Pair & Request Protocol
    // ---------------------------------------------------------------------------
    let isPairing = false;

    async function pairWithDesktop(code, deviceName) {
      if (isPairing) return;
      isPairing = true;
      try {
        const endpoint = window.location.origin;
        let inviteRes;
        try { inviteRes = await fetch(endpoint + "/mobile/v1/invite", { cache: "no-store" }); }
        catch { throw offlineError(); }
        if (!inviteRes.ok) {
          throw new Error("No pairing code is waiting on your computer. In OUTARCH, open Integrations, then Mobile Companion, and create one.");
        }
        const invite = await inviteRes.json();

        let clientPriv = PureCrypto.getRandomBytes(32);
        const basePoint = new Uint8Array(32); basePoint[0] = 9;
        const rawClientPub = PureCrypto.x25519ScalarMult(clientPriv, basePoint);
        const clientPubSpki = PureCrypto.x25519ExportSpki(rawClientPub);
        const clientPublicKey = bufToB64Url(clientPubSpki);

        const message = invite.pairingId + "|" + invite.nonce + "|" + deviceName.trim() + "|" + clientPublicKey;
        const proofBuf = PureCrypto.hmacSha256(code.trim(), message);
        const proof = bufToB64Url(proofBuf);

        let pairRes;
        try {
          pairRes = await fetch(endpoint + "/mobile/v1/pair", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              pairingId: invite.pairingId,
              deviceName: deviceName.trim(),
              clientPublicKey: clientPublicKey,
              proof: proof
            })
          });
        } catch { throw offlineError(); }

        if (!pairRes.ok) {
          const err = await pairRes.json().catch(() => ({}));
          throw new Error(pairingErrorText(err.error));
        }
        const pairData = await pairRes.json();

        const serverKeySpki = b64UrlToBuf(invite.serverPublicKey);
        const serverRawPub = PureCrypto.x25519ExtractRawFromSpki(serverKeySpki);
        const sharedBits = PureCrypto.x25519ScalarMult(clientPriv, serverRawPub);
        const saltBuf = b64UrlToBuf(invite.nonce);
        const aesKey = PureCrypto.hkdfSha256(sharedBits, saltBuf, "mission-control-mobile-pairing-v1", 32);

        const envelope = pairData.envelope;
        const iv = b64UrlToBuf(envelope.iv);
        const ciphertext = b64UrlToBuf(envelope.ciphertext);
        const tag = b64UrlToBuf(envelope.tag);
        const aad = new TextEncoder().encode(invite.pairingId);

        const decryptedBuf = PureCrypto.aesGcmDecrypt(aesKey, iv, ciphertext, tag, aad);
        const cred = JSON.parse(new TextDecoder().decode(decryptedBuf));

        cred.endpoint = endpoint;
        cred.deviceName = deviceName;
        cred.pairedAt = Date.now();
        if (!writeStorage(STORAGE_KEY, JSON.stringify(cred))) {
          throw new Error("This browser would not save the pairing. Leave private browsing and try again.");
        }
        SoundFx.beep("success");
        appendFeedItem({ kind: "system", title: "Phone paired", detail: "Connected to " + endpoint });
        return cred;
      } finally {
        isPairing = false;
      }
    }

    async function sendEncryptedRequest(cred, payload) {
      const enc = new TextEncoder();
      const deviceId = cred.deviceId;
      const secretBuf = b64UrlToBuf(cred.secret);
      const timestamp = Date.now();
      const nonce = "web-" + Math.random().toString(36).slice(2) + "-" + Date.now();
      const aadStr = API_VERSION + "|/mobile/v1/request|" + deviceId + "|" + timestamp + "|" + nonce;
      const aad = enc.encode(aadStr);

      const iv = PureCrypto.getRandomBytes(12);
      const plainBytes = enc.encode(JSON.stringify(payload));
      const { ciphertext, tag } = PureCrypto.aesGcmEncrypt(secretBuf, iv, plainBytes, aad);

      const reqEnvelope = {
        version: API_VERSION,
        iv: bufToB64Url(iv),
        ciphertext: bufToB64Url(ciphertext),
        tag: bufToB64Url(tag)
      };

      let res;
      try {
        res = await fetch(cred.endpoint + "/mobile/v1/request", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Mission-Control-Device": deviceId,
            "X-Mission-Control-Time": String(timestamp),
            "X-Mission-Control-Nonce": nonce
          },
          body: JSON.stringify(reqEnvelope)
        });
      } catch {
        throw offlineError();
      }

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        const errText = String(err.error || err.message || "Request failed");
        // Only a device the desktop no longer knows is forgotten here. A clock
        // that drifted or a project that changed is not a reason to unpair.
        if (/revoked|unknown|credential/i.test(errText)) {
          forgetPairing("This phone was removed on your computer, so it needs pairing again.");
          throw new Error("This phone was removed on your computer.");
        }
        throw new Error(errText);
      }

      const sealed = await res.json();
      const resIv = b64UrlToBuf(sealed.iv);
      const resCipher = b64UrlToBuf(sealed.ciphertext);
      const resTag = b64UrlToBuf(sealed.tag);
      const resAad = enc.encode(aadStr + "|response");

      const decryptedBuf = PureCrypto.aesGcmDecrypt(secretBuf, resIv, resCipher, resTag, resAad);
      const opened = JSON.parse(new TextDecoder().decode(decryptedBuf));
      return opened.result;
    }

    function forgetPairing(notice) {
      removeStorage(STORAGE_KEY);
      appState.data = null;
      appState.caps = null;
      appState.error = "";
      appState.busy = {};
      appState.pairNotice = notice || "";
      if (appState.detail || appState.confirming) closeActionModal();
      render();
    }

    // ---------------------------------------------------------------------------
    // Live updates: the desktop nudges over SSE, the poll is the floor
    // ---------------------------------------------------------------------------
    function connectSSE() {
      if (appState.sse) {
        appState.sse.close();
        appState.sse = null;
      }
      if (typeof EventSource !== "function") return;
      try {
        const sse = new EventSource(window.location.origin + "/mobile/v1/events");
        sse.addEventListener("status", () => { refreshDashboard(); });
        appState.sse = sse;
      } catch (err) {}
    }

    function setConnection(state) {
      const badge = document.getElementById("connectionStatus");
      if (!badge) return;
      const words = { live: "Live", connecting: "Connecting", offline: "Offline" };
      const next = "conn is-" + state;
      if (badge.className === next) return;
      badge.className = next;
      badge.innerHTML = "<i></i><span>" + (words[state] || "Connecting") + "</span>";
    }

    function setHeaderProject(name) {
      const sub = document.getElementById("headerSubtitle");
      if (sub && name && sub.textContent !== name) sub.textContent = name;
    }

    // A poll that lands while one is in flight runs once more afterwards, and
    // whoever asked waits for that, so nobody reads data from before a change.
    let refreshing = null;
    let refreshAgain = false;
    function refreshDashboard(manual = false) {
      if (refreshing) {
        refreshAgain = true;
        return refreshing;
      }
      refreshing = (async () => {
        let pass = 0;
        do {
          refreshAgain = false;
          await refreshOnce(manual && pass === 0);
          pass += 1;
        } while (refreshAgain && pass < 3);
      })().finally(() => { refreshing = null; });
      return refreshing;
    }

    async function refreshOnce(manual) {
      const cred = getStoredCredential();
      if (!cred) return;
      try {
        const data = await sendEncryptedRequest(cred, { operation: "snapshot" });
        if (!getStoredCredential()) return;
        const activeAttention = attentionOf(data);
        if (activeAttention.length > appState.previousAttentionCount && appState.data) {
          const newest = activeAttention[activeAttention.length - 1];
          triggerAlertNotification(
            "Needs you (" + activeAttention.length + ")",
            (newest?.sessionName || newest?.name || "A terminal") + ": " + (newest?.reason || newest?.attentionReason || "a decision is waiting"),
            "critical"
          );
        }
        appState.previousAttentionCount = activeAttention.length;
        appState.data = data;
        appState.caps = data.companion || null;
        appState.error = "";
        appState.lastOkAt = Date.now();
        setConnection("live");
        const projectName = data.project && data.project.name ? String(data.project.name) : "";
        if (projectName) {
          setHeaderProject(projectName);
          if (cred.projectName !== projectName) { cred.projectName = projectName; saveCredential(cred); }
        }
        if (manual) SoundFx.beep("info");
      } catch (err) {
        if (!getStoredCredential()) return;
        appState.error = String((err && err.message) || err || "The request failed");
        setConnection("offline");
      }
      renderActiveTab();
      updateBadges();
      renderBanner();
      refreshOpenDetail();
    }

    function renderBanner() {
      const banner = document.getElementById("banner");
      if (!banner) return;
      const show = Boolean(getStoredCredential() && appState.error && appState.data);
      if (!show) {
        if (!banner.hidden) { banner.hidden = true; banner.innerHTML = ""; }
        return;
      }
      const info = errorInfo(appState.error);
      const html = "<span><strong>" + esc(info.title) + ".</strong> Showing what it reported " + esc(ago(appState.lastOkAt)) + ".</span><button type=\"button\" onclick=\"refreshDashboard(true)\">Retry</button>";
      if (banner.innerHTML !== html) banner.innerHTML = html;
      banner.hidden = false;
    }

    function updateBadges() {
      const attentionCount = attentionOf(appState.data).length;
      const navBadgeNeeds = document.getElementById("navBadgeNeeds");
      if (navBadgeNeeds) {
        navBadgeNeeds.hidden = attentionCount === 0;
        navBadgeNeeds.textContent = attentionCount > 9 ? "9+" : String(attentionCount);
      }
      try { document.title = (attentionCount ? "(" + attentionCount + ") " : "") + "OUTARCH"; } catch {}
    }

    function syncTabs() {
      const current = appState.tab === "memory" || appState.tab === "feed" || appState.tab === "privacy" ? "settings" : appState.tab;
      document.querySelectorAll(".tab").forEach(el => {
        const active = el.getAttribute("data-tab") === current;
        el.classList.toggle("is-active", active);
        if (active) el.setAttribute("aria-current", "page");
        else el.removeAttribute("aria-current");
      });
    }

    function switchTab(tab) {
      const leaving = appState.tab;
      appState.tab = tab;
      appState.lastHtml = "";
      syncTabs();
      renderActiveTab(true);
      if (leaving !== tab || tab !== "ask") {
        try { window.scrollTo(0, 0); } catch {}
      }
    }
    function goHome() {
      if (getStoredCredential()) switchTab("overview");
    }

    // ---------------------------------------------------------------------------
    // Painting without dropping taps: a repaint keeps every node that did not
    // change, so a button under a finger is still the same button afterwards.
    // ---------------------------------------------------------------------------
    function sameKind(a, b) {
      if (a.nodeType !== b.nodeType) return false;
      if (a.nodeType !== 1) return true;
      return a.tagName === b.tagName && (a.getAttribute("data-key") || "") === (b.getAttribute("data-key") || "");
    }
    function morphElement(have, want) {
      const tag = have.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") {
        if (have === document.activeElement) return;
        if (have.outerHTML !== want.outerHTML) have.replaceWith(want.cloneNode(true));
        return;
      }
      for (let i = have.attributes.length - 1; i >= 0; i--) {
        const name = have.attributes[i].name;
        if (!want.hasAttribute(name)) have.removeAttribute(name);
      }
      for (let i = 0; i < want.attributes.length; i++) {
        const attr = want.attributes[i];
        if (have.getAttribute(attr.name) !== attr.value) have.setAttribute(attr.name, attr.value);
      }
      if (have.innerHTML !== want.innerHTML) morphChildren(have, want);
    }
    function morphChildren(target, source) {
      const wanted = Array.prototype.slice.call(source.childNodes);
      for (let i = 0; i < wanted.length; i++) {
        const want = wanted[i];
        const have = target.childNodes[i];
        if (!have) { target.appendChild(want.cloneNode(true)); continue; }
        if (!sameKind(have, want)) { target.replaceChild(want.cloneNode(true), have); continue; }
        if (have.nodeType !== 1) { if (have.nodeValue !== want.nodeValue) have.nodeValue = want.nodeValue; continue; }
        morphElement(have, want);
      }
      while (target.childNodes.length > wanted.length) target.removeChild(target.lastChild);
    }
    function patchHtml(el, html) {
      if (!el) return;
      // The first paint, or a page without a real DOM, simply writes.
      if (el.firstChild === undefined || !el.childNodes || !el.childNodes.length) { el.innerHTML = html; return; }
      try {
        const template = document.createElement("template");
        template.innerHTML = html;
        if (!template.content) { el.innerHTML = html; return; }
        morphChildren(el, template.content);
      } catch {
        el.innerHTML = html;
      }
    }
    function playEnter(el) {
      if (!el || !el.classList || el.offsetWidth === undefined) return;
      el.classList.remove("enter");
      void el.offsetWidth;
      el.classList.add("enter");
    }

    // ---------------------------------------------------------------------------
    // The bottom sheet: summaries and confirmations
    // ---------------------------------------------------------------------------
    let sheetOpener = null;
    function openActionModal(title, formHtml, options) {
      const keepScroll = Boolean(options && options.keepScroll);
      const layer = document.getElementById("actionModal");
      const body = document.getElementById("modalBody");
      const wasOpen = Boolean(layer && layer.classList && layer.classList.contains("is-open"));
      const titleEl = document.getElementById("modalTitle");
      if (titleEl && titleEl.innerText !== title) titleEl.innerText = title;
      if (appState.modalHtml !== formHtml) {
        if (keepScroll && wasOpen) patchHtml(body, formHtml);
        else {
          body.innerHTML = formHtml;
          if (body) body.scrollTop = 0;
        }
        appState.modalHtml = formHtml;
      }
      if (!wasOpen) {
        sheetOpener = document.activeElement || null;
        layer.classList.add("is-open");
        if (document.body) document.body.classList.add("sheet-open");
        const sheet = document.getElementById("actionSheet");
        if (sheet && typeof sheet.focus === "function") {
          try { sheet.focus({ preventScroll: true }); } catch {}
        }
      }
    }
    function closeActionModal() {
      const layer = document.getElementById("actionModal");
      if (layer) layer.classList.remove("is-open");
      if (document.body) document.body.classList.remove("sheet-open");
      appState.modalHtml = "";
      appState.detail = null;
      appState.confirming = false;
      const opener = sheetOpener;
      sheetOpener = null;
      if (opener && typeof opener.focus === "function" && opener.isConnected) {
        try { opener.focus({ preventScroll: true }); } catch {}
      }
    }
    function backToDetail() {
      appState.confirming = false;
      if (appState.detail) showDetail();
      else closeActionModal();
    }

    // Drag the sheet down by its handle to put it away.
    function wireSheetDrag() {
      const grip = document.getElementById("sheetGrip");
      const sheet = document.getElementById("actionSheet");
      if (!grip || !sheet || typeof grip.addEventListener !== "function") return;
      let startY = 0;
      let lastY = 0;
      let lastT = 0;
      let velocity = 0;
      let dragging = false;
      grip.addEventListener("touchstart", event => {
        if (!event.touches || event.touches.length !== 1) return;
        dragging = true;
        startY = lastY = event.touches[0].clientY;
        lastT = Date.now();
        velocity = 0;
        sheet.classList.add("is-dragging");
      }, { passive: true });
      grip.addEventListener("touchmove", event => {
        if (!dragging) return;
        const y = event.touches[0].clientY;
        const now = Date.now();
        velocity = (y - lastY) / Math.max(1, now - lastT);
        lastY = y;
        lastT = now;
        const dy = Math.max(0, y - startY);
        sheet.style.transform = "translateY(" + dy + "px)";
      }, { passive: true });
      const end = () => {
        if (!dragging) return;
        dragging = false;
        sheet.classList.remove("is-dragging");
        const dy = Math.max(0, lastY - startY);
        sheet.style.transform = "";
        if (dy > 110 || (dy > 30 && velocity > 0.55)) closeActionModal();
      };
      grip.addEventListener("touchend", end);
      grip.addEventListener("touchcancel", end);
    }

    // ---------------------------------------------------------------------------
    // Worker & Recipe Action Words
    // ---------------------------------------------------------------------------
    const WORKER_ACTIONS = ["start", "restart", "stop", "acknowledge"];
    const ACTION_COPY = {
      start: { title: "Start", busy: "Starting…", done: "started" },
      restart: { title: "Restart", busy: "Restarting…", done: "restarted" },
      stop: { title: "Stop", busy: "Stopping…", done: "stopped" },
      acknowledge: { title: "Acknowledge", busy: "Acknowledging…", done: "acknowledged" }
    };
    const RECIPE_ACTIONS = ["run", "recover", "cancel"];
    const RECIPE_COPY = {
      run: { title: "Run", busy: "Starting…", done: "is starting" },
      recover: { title: "Recover", busy: "Recovering…", done: "is recovering" },
      cancel: { title: "Cancel", busy: "Cancelling…", done: "was cancelled" }
    };

    function isAutoAction(kind, action) {
      const caps = appState.caps;
      return Boolean(caps && caps.autoRun && caps.autoActions && (caps.autoActions[kind] || []).indexOf(action) !== -1);
    }
    function canControl() {
      return !appState.caps || appState.caps.canControl !== false;
    }
    function friendlyError(err) {
      const text = String((err && err.message) || err || "The request failed");
      if (/permission required/i.test(text)) return "This phone is not allowed to do that. Allow it on the desktop, then pair again.";
      return text;
    }

    function reportOutcome(res, title, name, done) {
      const state = res && res.state;
      if (state === "approved") {
        SoundFx.beep("success");
        SoundFx.vibrate([60]);
        showToast(name + " " + done, "success");
        appendFeedItem({ kind: "action", title: title + " · " + name, detail: "Done from this phone" });
      } else if (state === "pending") {
        SoundFx.beep("info");
        showToast("Sent to your desktop. Approve “" + title.toLowerCase() + " " + name + "” there.", "warning");
        appendFeedItem({ kind: "action", title: title + " · " + name, detail: "Waiting for approval on the desktop" });
      } else if (state === "failed") {
        SoundFx.beep("alert");
        const reason = (res && res.error) || "the desktop refused it";
        showToast("Could not " + title.toLowerCase() + " " + name + ": " + reason, "critical");
        appendFeedItem({ kind: "alert", title: title + " failed · " + name, detail: reason });
      } else {
        showToast(title + " sent for " + name, "info");
      }
    }

    function repaintBusy() {
      renderActiveTab();
      if (appState.detail && !appState.confirming) showDetail();
    }

    function impactNote(workerId) {
      const w = ((appState.data && appState.data.workers) || []).find(item => item.id === workerId);
      const impact = w && w.dependencyImpact;
      const n = impact ? Number(impact.downstreamCount) || 0 : 0;
      return n === 1 ? " 1 other terminal depends on it." : n > 1 ? " " + n + " other terminals depend on it." : "";
    }

    // ---------------------------------------------------------------------------
    // Terminal requests
    // ---------------------------------------------------------------------------
    function promptWorkerAction(workerId, action, defaultName) {
      if (!WORKER_ACTIONS.includes(action)) return;
      const name = defaultName || workerId;
      if (action === "start" || action === "acknowledge") { submitWorkerAction(workerId, action, name); return; }
      const auto = isAutoAction("worker", action);
      appState.confirming = true;
      const html = `
        <div class="confirm">
          <p>${auto
            ? "<strong>" + esc(name) + "</strong> " + (action === "restart" ? "restarts right away" : "stops right away") + ". Your desktop is not asked." + esc(impactNote(workerId))
            : "Your desktop will ask you to approve this before anything happens." + esc(impactNote(workerId))}</p>
          ${auto ? "" : `<div class="input-group">
            <label for="actionReason">Note for the desktop (optional)</label>
            <input id="actionReason" type="text" maxlength="200" value="${esc("Mobile: " + action)}">
          </div>`}
          <div class="confirm-actions">
            <button type="button" class="btn btn-secondary" onclick="backToDetail()">Cancel</button>
            <button type="button" class="btn ${action === "stop" ? "btn-danger" : "btn-primary"}" id="btnSubmitAction" data-id="${esc(workerId)}" data-action="${esc(action)}" data-name="${esc(name)}" onclick="submitWorkerAction(this.dataset.id, this.dataset.action, this.dataset.name)">${esc(auto ? ACTION_COPY[action].title + " now" : "Ask desktop")}</button>
          </div>
        </div>
      `;
      openActionModal(ACTION_COPY[action].title + " " + name + "?", html);
    }

    async function submitWorkerAction(workerId, action, name) {
      const cred = getStoredCredential();
      if (!cred) return;
      const key = "worker:" + workerId;
      if (appState.busy[key]) return;
      const label = name || workerId;
      const copy = ACTION_COPY[action];
      const note = document.getElementById("actionReason");
      const reason = (note && note.value) || "Mobile: " + action;
      appState.busy[key] = copy.busy;
      backToDetail();
      repaintBusy();
      try {
        const res = await sendEncryptedRequest(cred, { operation: "request-worker-action", workerId: workerId, action: action, reason: reason });
        reportOutcome(res, copy.title, label, copy.done);
      } catch (err) {
        SoundFx.beep("alert");
        showToast(friendlyError(err), "critical");
      } finally {
        delete appState.busy[key];
      }
      repaintBusy();
      refreshDashboard();
    }

    // ---------------------------------------------------------------------------
    // Recipe requests
    // ---------------------------------------------------------------------------
    function promptRecipeAction(recipeId, action, defaultName) {
      if (!RECIPE_ACTIONS.includes(action)) return;
      const d = appState.data || {};
      const recipe = (d.recipes || []).find(item => item.id === recipeId);
      const names = {};
      (d.workers || []).forEach(w => { names[w.id] = w.name || w.id; });
      const order = recipe ? (recipe.steps || []).map(step => names[step.workerId] || step.workerId) : [];
      const name = defaultName || (recipe && recipe.name) || recipeId;
      const auto = isAutoAction("recipe", action);
      const what = action === "run"
        ? "Starts " + order.length + " terminal" + (order.length === 1 ? "" : "s") + " in order: " + order.join(" → ") + "."
        : action === "recover"
          ? "Picks the last failed run back up where it stopped."
          : "Stops the run that is in progress. Terminals it already started keep running.";
      appState.confirming = true;
      const html = `
        <div class="confirm">
          <p>${esc(what)} ${esc(auto ? "It starts right away. Your desktop is not asked." : "Your desktop will ask you to approve this first.")}</p>
          ${auto ? "" : `<div class="input-group">
            <label for="actionReason">Note for the desktop (optional)</label>
            <input id="actionReason" type="text" maxlength="200" value="${esc("Mobile: " + action + " " + name)}">
          </div>`}
          <div class="confirm-actions">
            <button type="button" class="btn btn-secondary" onclick="backToDetail()">Cancel</button>
            <button type="button" class="btn ${action === "cancel" ? "btn-danger" : "btn-primary"}" id="btnSubmitRecipe" data-id="${esc(recipeId)}" data-action="${esc(action)}" data-name="${esc(name)}" onclick="submitRecipeAction(this.dataset.id, this.dataset.action, this.dataset.name)">${esc(auto ? RECIPE_COPY[action].title + " now" : "Ask desktop")}</button>
          </div>
        </div>
      `;
      openActionModal(RECIPE_COPY[action].title + " " + name + "?", html);
    }

    async function submitRecipeAction(recipeId, action, name) {
      const cred = getStoredCredential();
      if (!cred) return;
      const key = "recipe:" + recipeId;
      if (appState.busy[key]) return;
      const label = name || recipeId;
      const copy = RECIPE_COPY[action];
      const note = document.getElementById("actionReason");
      const reason = (note && note.value) || "Mobile: " + action + " " + label;
      appState.busy[key] = copy.busy;
      closeActionModal();
      renderActiveTab();
      try {
        const res = await sendEncryptedRequest(cred, { operation: "request-recipe-action", recipeId: recipeId, action: action, reason: reason });
        reportOutcome(res, copy.title, label, copy.done);
      } catch (err) {
        SoundFx.beep("alert");
        showToast(friendlyError(err), "critical");
      } finally {
        delete appState.busy[key];
      }
      renderActiveTab();
      refreshDashboard();
    }

    // ---------------------------------------------------------------------------
    // Terminal Summary Sheet
    // ---------------------------------------------------------------------------
    function detailWorker() {
      const detail = appState.detail;
      if (!detail || !appState.data) return null;
      return (appState.data.workers || []).find(w => w.id === detail.id) || null;
    }
    function showDetail() {
      const w = detailWorker();
      if (!w) { closeActionModal(); return; }
      openActionModal(w.name || w.id, renderWorkerDetail(appState.data, w, appState.detail.output), { keepScroll: true });
    }
    function openWorkerDetail(workerId) {
      if (!appState.data) return;
      appState.confirming = false;
      appState.detail = { id: workerId, output: { state: "loading", lines: [], at: 0 } };
      appState.modalHtml = "";
      showDetail();
      loadDetailOutput(workerId);
    }
    async function loadDetailOutput(workerId) {
      const cred = getStoredCredential();
      if (!cred) return;
      const previous = appState.detail && appState.detail.id === workerId ? appState.detail.output : null;
      let output;
      try {
        const res = await sendEncryptedRequest(cred, { operation: "worker", workerId: workerId });
        const w = (res && res.worker) || {};
        output = res && res.outputAllowed === false
          ? { state: "off", lines: [], at: 0 }
          : { state: "ok", lines: Array.isArray(w.recentOutput) ? w.recentOutput : [], at: w.lastOutputAt || 0 };
      } catch (err) {
        output = previous && previous.state === "ok" ? previous : { state: "error", lines: [], at: 0, message: friendlyError(err) };
      }
      if (!appState.detail || appState.detail.id !== workerId) return;
      appState.detail.output = output;
      if (!appState.confirming) showDetail();
    }
    function refreshOpenDetail() {
      if (!appState.detail || appState.confirming) return;
      if (!detailWorker()) {
        closeActionModal();
        showToast("That terminal is no longer in this project", "warning");
        return;
      }
      loadDetailOutput(appState.detail.id);
    }
    function setWorkersView(view) {
      appState.workersView = view === "recipes" ? "recipes" : "terminals";
      appState.lastHtml = "";
      renderActiveTab(true);
    }
    function openRecipes() {
      appState.workersView = "recipes";
      switchTab("workers");
    }

    // ---------------------------------------------------------------------------
    // Worker formatting & views
    // ---------------------------------------------------------------------------
    const WORKER_STATES = {
      running: { label: "Running", tone: "running" },
      working: { label: "Working", tone: "running" },
      starting: { label: "Starting", tone: "warning" },
      waiting: { label: "Waiting", tone: "warning" },
      "needs-you": { label: "Needs you", tone: "warning" },
      failed: { label: "Failed", tone: "critical" },
      completed: { label: "Finished", tone: "idle" },
      stopped: { label: "Stopped", tone: "idle" }
    };
    // The page's own colour word for each of the engine's tones.
    const TONE_CLASS = { running: "tone-ok", warning: "tone-warn", critical: "tone-danger", idle: "tone-idle" };
    function workerView(w) {
      const alive = w.isAlive === true || w.status === "running";
      let key = String(w.state || "");
      if (!WORKER_STATES[key]) key = w.status === "failed" ? "failed" : alive ? "running" : "stopped";
      const info = WORKER_STATES[key];
      return { key: key, label: info.label, tone: info.tone, alive: alive };
    }
    function fmtDuration(ms) {
      const s = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
      if (s < 60) return s + "s";
      const m = Math.floor(s / 60);
      if (m < 60) return m + "m";
      const h = Math.floor(m / 60);
      if (h < 24) return h + "h " + (m % 60) + "m";
      return Math.floor(h / 24) + "d " + (h % 24) + "h";
    }
    function ago(ts) {
      if (!ts) return "never";
      const s = Math.floor((Date.now() - Number(ts)) / 1000);
      return s < 5 ? "just now" : fmtDuration(s * 1000) + " ago";
    }
    const ANSI_PATTERN = new RegExp(String.fromCharCode(27) + "\\[[0-9;?]*[ -/]*[@-~]", "g");
    const CONTROL_PATTERN = new RegExp("[" + String.fromCharCode(0) + "-" + String.fromCharCode(8) + String.fromCharCode(11) + "-" + String.fromCharCode(31) + String.fromCharCode(127) + "]", "g");
    function plainLine(line) {
      return String(line == null ? "" : line).replace(ANSI_PATTERN, "").replace(CONTROL_PATTERN, "");
    }

    function workerHeadline(w, view) {
      const reason = w.attention && w.attention.required ? (w.attention.reason || "Operator review is required.") : "";
      if (view.key === "needs-you") return "Waiting for you: " + reason;
      if (view.key === "failed") return "Failed" + (Number.isInteger(w.exitCode) ? " with exit code " + w.exitCode : "") + ". " + (reason || "Restart it, or read the last output below.");
      if (view.key === "starting") return "Starting up.";
      if (view.alive) return "Running for " + fmtDuration(w.runtimeMs) + ".";
      if (view.key === "completed") return "Finished successfully.";
      return "Not running.";
    }
    function workerFacts(w, view) {
      const facts = [];
      facts.push(["Last output", ago(w.lastOutputAt), ""]);
      if (!view.alive && Number.isInteger(w.exitCode)) facts.push(["Exit code", String(w.exitCode), ""]);
      const r = w.resources;
      if (r && r.available) {
        if (r.cpuPercent != null && Number.isFinite(Number(r.cpuPercent))) facts.push(["CPU", Math.round(Number(r.cpuPercent)) + "%", ""]);
        if (r.memoryMB != null && Number.isFinite(Number(r.memoryMB))) facts.push(["Memory", Math.round(Number(r.memoryMB)) + " MB", ""]);
      }
      const impact = w.dependencyImpact;
      if (impact && Number(impact.recipeCount) > 0) facts.push(["In recipes", String(impact.recipeCount), ""]);
      if (impact && Number(impact.downstreamCount) > 0) facts.push(["Others depend on it", String(impact.downstreamCount), ""]);
      if (w.command) facts.push(["Command", w.command + (w.args && w.args.length ? " " + w.args.join(" ") : ""), "wide mono"]);
      if (w.cwd) facts.push(["Folder", w.cwd, "wide mono"]);
      return facts;
    }
    function workerSignals(w) {
      const e = w.evidence || {};
      const out = [];
      const has = value => value != null && value !== "";
      if (e.tests) {
        const failed = Number(e.tests.failed) || 0;
        if (has(e.tests.passed) || failed) out.push({ label: "Tests", value: (Number(e.tests.passed) || 0) + " passed" + (failed ? " · " + failed + " failed" : ""), tone: failed ? "critical" : "running" });
      }
      if (e.build) out.push({ label: "Build", value: String(e.build.phase || (Number(e.build.durationMs) ? "done in " + fmtDuration(e.build.durationMs) : "seen")), tone: e.build.phase === "failed" ? "critical" : "idle" });
      if (e.service) {
        const where = e.service.port ? "port " + e.service.port : e.service.origin;
        out.push({ label: "Service", value: [where, e.service.health].filter(has).join(" · ") || "seen", tone: e.service.health === "failed" ? "critical" : e.service.health === "confirmed" ? "running" : "idle" });
      }
      if (e.git) out.push({ label: "Git", value: [e.git.branch, e.git.clean === true ? "clean" : Number(e.git.changedPaths) ? e.git.changedPaths + " changes" : ""].filter(has).join(" · ") || "active", tone: "idle" });
      if (e.database) out.push({ label: "Database", value: [e.database.connection, has(e.database.migrations) ? "migrations " + e.database.migrations : ""].filter(has).join(" · ") || "seen", tone: e.database.connection === "failed" ? "critical" : "idle" });
      if (e.container) out.push({ label: "Container", value: [e.container.state, e.container.image].filter(has).join(" · ") || "seen", tone: e.container.healthy === false ? "critical" : "idle" });
      return out;
    }

    function noControlNote() {
      return '<p class="note">' + icon("eye") + '<span>This phone can watch but not control. Turn on “Control workers &amp; recipes” on the desktop, then pair this phone again.</span></p>';
    }
    function workerButtons(w, view) {
      const busy = appState.busy["worker:" + w.id];
      if (busy) return '<button class="action-btn primary" disabled>' + esc(busy) + '</button>';
      const off = canControl() ? "" : " disabled";
      const name = w.name || w.id;
      const btn = (action, cls, label) => '<button class="action-btn ' + cls + '" ' + workerActionAttrs(w.id, action, name) + off + '>' + esc(label) + '</button>';
      return view.alive ? btn("restart", "", "Restart") + btn("stop", "danger", "Stop") : btn("start", "primary", "Start");
    }

    function renderWorkerDetail(d, w, output) {
      const view = workerView(w);
      const name = w.name || w.id;
      const shownAbove = Boolean(output && output.state === "ok" && output.at);
      const facts = workerFacts(w, view).filter(fact => !(shownAbove && fact[0] === "Last output"));
      const signals = workerSignals(w);
      const health = w.health && w.health.summary
        ? '<div class="health-note"><strong>' + esc(w.health.label || "Health") + '.</strong> ' + esc(w.health.summary) + '</div>'
        : "";
      let out;
      if (!output || output.state === "loading") out = '<div class="term-empty">Reading the terminal…</div>';
      else if (output.state === "off") out = '<div class="term-empty">Terminal output is off for this phone. Allow “Terminal Evidence” on the desktop, then pair again to see it here.</div>';
      else if (output.state === "error") out = '<div class="term-empty">' + esc(output.message || "Could not read the terminal.") + '</div>';
      else {
        const lines = (output.lines || []).map(plainLine).filter(line => line.trim());
        out = lines.length ? '<pre class="term-out">' + esc(lines.join(NL)) + '</pre>' : '<div class="term-empty">This terminal has not printed anything yet.</div>';
      }
      const caption = output && output.state === "ok" && output.at ? "Last output · " + ago(output.at) : "Last output";
      const attention = w.attention && w.attention.required;
      const acknowledge = attention && !appState.busy["worker:" + w.id]
        ? '<button class="action-btn warn" ' + workerActionAttrs(w.id, "acknowledge", name) + (canControl() ? "" : " disabled") + '>Acknowledge</button>'
        : "";
      const explain = canAsk(getStoredCredential())
        ? '<button type="button" class="explain" data-name="' + esc(name) + '" onclick="explainWorker(this.dataset.name)">' + icon("sparkle") + "<span>Explain with Mission AI</span></button>"
        : "";
      const toneClass = TONE_CLASS[view.tone] || "tone-idle";
      return `
        <div class="detail">
          <div class="detail-head">
            <span class="pill ${toneClass}"><i></i>${esc(view.label)}</span>
            <span class="detail-role">${esc(w.role || "terminal")}</span>
          </div>
          <p class="detail-headline">${esc(workerHeadline(w, view))}</p>
          ${view.alive && w.currentActivity ? '<p class="detail-now">' + esc(w.currentActivity) + '</p>' : ""}
          ${signals.length ? '<div class="signal-row">' + signals.map(s => '<span class="signal ' + s.tone + '"><small>' + esc(s.label) + '</small>' + esc(s.value) + '</span>').join("") + '</div>' : ""}
          ${health}
          ${explain}
          <div class="term-block">
            <small class="term-cap">${esc(caption)}</small>
            ${out}
          </div>
          <div class="fact-grid">${facts.map(fact => '<div class="' + esc(fact[2]) + '"><small>' + esc(fact[0]) + '</small><b class="' + esc(fact[2]) + '">' + esc(fact[1]) + '</b></div>').join("")}</div>
          ${canControl() ? "" : noControlNote()}
          <div class="detail-actions">${acknowledge}${workerButtons(w, view)}</div>
        </div>
      `;
    }

    function explainWorker(name) {
      closeActionModal();
      switchTab("ask");
      const text = "Explain why terminal " + name + " is failing or what happened, and what I should do next.";
      appState.ask.draft = text;
      submitAsk();
    }

    // One line per terminal: tap it for the summary, or use the one action
    // that fits where it is. Nothing in a row changes with the clock, so a
    // poll repaints a row only when the desktop reports something new.
    function terminalCard(w) {
      const view = workerView(w);
      const name = w.name || w.id;
      const toneClass = TONE_CLASS[view.tone] || "tone-idle";
      let detail = view.label;
      if (view.key === "failed" && Number.isInteger(w.exitCode)) detail = "Failed · exit " + w.exitCode;
      if (view.key === "needs-you" && w.attention && w.attention.reason) detail = "Needs you · " + w.attention.reason;
      const role = w.role && w.role !== "terminal" ? esc(w.role) + " · " : "";
      const busy = appState.busy["worker:" + w.id];
      let quick;
      if (busy) {
        quick = '<button type="button" class="quick is-busy" disabled aria-label="' + esc(busy) + '"><span class="spin" aria-hidden="true"></span></button>';
      } else {
        const action = view.alive ? "restart" : "start";
        const off = canControl() ? "" : " disabled";
        quick = '<button type="button" class="quick" aria-label="' + esc((view.alive ? "Restart " : "Start ") + name) + '" ' + workerActionAttrs(w.id, action, name) + off + '>' + icon(view.alive ? "restart" : "play") + '</button>';
      }
      return `
        <div class="term ${toneClass}" data-key="w:${esc(w.id)}">
          <button type="button" class="term-open" data-id="${esc(w.id)}" aria-label="${esc("Summary of " + name)}" onclick="openWorkerDetail(this.dataset.id)">
            <span class="dot ${toneClass}" aria-hidden="true"></span>
            <span class="term-text"><strong>${esc(name)}</strong><small>${role}<b>${esc(detail)}</b></small></span>
          </button>
          ${quick}
        </div>
      `;
    }

    const RECIPE_STEP_CLASS = { ready: "is-ok", failed: "is-bad", starting: "is-run", running: "is-run", waiting: "is-run" };
    function renderRecipeCard(r, names = {}) {
      const run = r.run;
      const phase = run ? run.phase : "idle";
      const steps = r.steps || [];
      const busy = appState.busy["recipe:" + r.id];
      const off = busy || !canControl() ? " disabled" : "";

      let actionBtn = "";
      if (phase === "running") {
        actionBtn = `<button class="action-btn danger" ${recipeActionAttrs(r.id, "cancel", r.name)}${off}>${esc(busy || "Cancel run")}</button>`;
      } else if (phase === "failed") {
        actionBtn = `<button class="action-btn warn" ${recipeActionAttrs(r.id, "recover", r.name)}${off}>${esc(busy || "Recover")}</button><button class="action-btn primary" ${recipeActionAttrs(r.id, "run", r.name)}${off}>${esc(busy || "Run again")}</button>`;
      } else {
        actionBtn = `<button class="action-btn primary" ${recipeActionAttrs(r.id, "run", r.name)}${off}>${esc(busy || "Run recipe")}</button>`;
      }

      const failures = run && run.failures ? run.failures : [];
      const failHtml = failures.length
        ? '<div class="recipe-failures">' + failures.map(f => "<p>" + esc(names[f.workerId] || f.workerId) + ": " + esc(f.reason || "Failed") + "</p>").join("") + "</div>"
        : "";

      const stepsHtml = steps.map(s => {
        const sState = run && run.stepStates && run.stepStates[s.workerId];
        const cls = sState ? RECIPE_STEP_CLASS[sState.phase] || "" : "";
        const depStr = s.dependsOn && s.dependsOn.length ? " after " + s.dependsOn.map(dep => esc(names[dep] || dep)).join(", ") : "";
        return "<li" + (cls ? ' class="' + cls + '"' : "") + "><b>" + esc(names[s.workerId] || s.workerId) + "</b>" + depStr + "</li>";
      }).join("");

      const badge = phase === "failed"
        ? '<span class="badge tone-danger"><i></i>Failed</span>'
        : phase === "running"
          ? '<span class="badge tone-ok"><i></i>Running</span>'
          : '<span class="badge">Ready</span>';

      return `
        <article class="card recipe-card" data-key="r:${esc(r.id)}">
          <header class="recipe-head">
            <div><strong>${esc(r.name || r.id)}</strong><small>${steps.length} terminal${steps.length === 1 ? "" : "s"}</small></div>
            ${badge}
          </header>
          ${steps.length ? '<ol class="steps">' + stepsHtml + "</ol>" : ""}
          ${failHtml}
          <div class="recipe-actions">${actionBtn}</div>
        </article>
      `;
    }

    function renderRecipesView(d) {
      const recipes = d.recipes || [];
      if (!recipes.length) {
        return '<div class="empty tone-idle"><span class="empty-icon">' + icon("recipe") + '</span><strong>No recipes yet</strong><p>No recipes in this project yet. A recipe starts several terminals in order; make one in Recipes on your computer.</p></div>';
      }
      const names = {};
      (d.workers || []).forEach(w => { names[w.id] = w.name || w.id; });
      return '<div class="item-list">' + recipes.map(r => renderRecipeCard(r, names)).join("") + "</div>";
    }

    // Most urgent first: what failed, what is waiting, then what runs.
    const URGENCY = { failed: 0, "needs-you": 1, waiting: 2, starting: 3, running: 4, working: 4, stopped: 5, completed: 6 };
    function byUrgency(workers) {
      return workers
        .map((w, index) => ({ w, index, rank: URGENCY[workerView(w).key] ?? 5 }))
        .sort((a, b) => a.rank - b.rank || a.index - b.index)
        .map(item => item.w);
    }

    function attentionCard(item, known, compact) {
      const targetId = item.workerId || item.sessionId || item.id;
      const targetName = item.sessionName || item.name || targetId;
      const reasonText = item.reason || item.attentionReason || "This terminal is waiting for a decision.";
      const worker = known[targetId];
      const alive = worker ? workerView(worker).alive : false;
      const failed = worker ? workerView(worker).key === "failed" : false;
      const busy = appState.busy["worker:" + targetId];
      const off = busy || !canControl() ? " disabled" : "";
      const restart = '<button class="action-btn ' + (alive ? "" : "primary") + '" ' + workerActionAttrs(targetId, "restart", targetName) + off + ">" + esc(busy || "Restart") + "</button>";
      const acknowledge = '<button class="action-btn" ' + workerActionAttrs(targetId, "acknowledge", targetName) + off + ">Acknowledge</button>";
      const summary = worker ? '<button class="action-btn ' + (alive ? "primary" : "") + '" data-id="' + esc(targetId) + '" onclick="openWorkerDetail(this.dataset.id)">Summary</button>' : "";
      const actions = alive ? summary + acknowledge + restart : restart + acknowledge + summary;
      const tone = failed ? "tone-danger" : "tone-warn";
      const kind = failed ? "Failed" : "Waiting for you";
      return `
        <article class="attn ${tone}${compact ? " is-compact" : ""}" data-key="a:${esc(item.id || targetId)}">
          <div class="attn-top">
            <span class="attn-icon">${icon("alert")}</span>
            <div><strong>${esc(targetName)}</strong><small>${esc(kind)}${worker && worker.role ? " · " + esc(worker.role) : ""}</small></div>
          </div>
          <p class="attn-reason">${esc(reasonText)}</p>
          <div class="attn-actions">${actions}</div>
        </article>
      `;
    }

    function heroFor(d, attention) {
      const workers = d.workers || [];
      const views = workers.map(workerView);
      const running = views.filter(view => view.alive).length;
      const failed = views.filter(view => view.key === "failed").length;
      const names = list => list.slice(0, 2).join(" and ") + (list.length > 2 ? " and " + (list.length - 2) + " more" : "");
      if (!workers.length) return { tone: "tone-idle", icon: "moon", title: "No terminals yet", sub: "Add terminals to this project in OUTARCH on your computer." };
      if (attention.length) {
        const who = attention.map(item => item.sessionName || item.name || item.workerId || item.sessionId).filter(Boolean);
        return { tone: "tone-warn", icon: "alert", title: attention.length === 1 ? "1 thing needs you" : attention.length + " things need you", sub: who.length ? names(who) + (who.length === 1 ? " is" : " are") + " waiting." : "A terminal is waiting for a decision." };
      }
      if (failed) {
        const who = workers.filter(w => workerView(w).key === "failed").map(w => w.name || w.id);
        return { tone: "tone-danger", icon: "x", title: plural(failed, "terminal") + " failed", sub: names(who) + " stopped with an error." };
      }
      if (running === workers.length) return { tone: "tone-ok", icon: "check", title: "Everything is running", sub: plural(workers.length, "terminal") + ", all reported healthy by your computer." };
      if (running) return { tone: "tone-ok", icon: "pulse", title: running + " of " + workers.length + " running", sub: "The rest are stopped or finished." };
      return { tone: "tone-idle", icon: "moon", title: "Nothing is running", sub: "Start a terminal or run a recipe from here." };
    }

    function renderOverviewTab(d) {
      const workers = d.workers || [];
      const recipes = d.recipes || [];
      const attention = attentionOf(d);
      const known = {};
      workers.forEach(w => { known[w.id] = w; });
      const runningCount = workers.filter(w => workerView(w).alive).length;
      const needsCount = attention.length;
      const hero = heroFor(d, attention);
      const shown = byUrgency(workers).slice(0, 6);
      return `
        <section class="hero ${hero.tone}" aria-live="polite">
          <span class="hero-icon">${icon(hero.icon)}</span>
          <div><h1>${esc(hero.title)}</h1><p>${esc(hero.sub)}</p></div>
        </section>
        <div class="stats">
          <button type="button" class="stat tone-ok" onclick="switchTab('workers')"><b>${runningCount}<span>/${workers.length}</span></b><small>Running</small></button>
          <button type="button" class="stat ${needsCount ? "tone-warn" : ""}" onclick="switchTab('needs')"><b>${needsCount}</b><small>Needs you</small></button>
          <button type="button" class="stat" onclick="openRecipes()"><b>${recipes.length}</b><small>${recipes.length === 1 ? "Recipe" : "Recipes"}</small></button>
        </div>
        ${needsCount ? `
          <section class="block">
            <header class="block-head"><h2>Needs you</h2>${needsCount > 2 ? `<button type="button" class="link" onclick="switchTab('needs')">See all ${needsCount}</button>` : ""}</header>
            ${attention.slice(0, 2).map(item => attentionCard(item, known, true)).join("")}
          </section>` : ""}
        <section class="block">
          <header class="block-head"><h2>Terminals</h2>${workers.length > shown.length ? `<button type="button" class="link" onclick="switchTab('workers')">See all ${workers.length}</button>` : ""}</header>
          ${workers.length ? '<div class="list">' + shown.map(terminalCard).join("") + '</div><p class="hint">Tap a terminal for its summary.</p>' : '<div class="empty tone-idle"><span class="empty-icon">' + icon("moon") + '</span><strong>No terminals yet</strong><p>Terminals you add to this project on your computer show up here.</p></div>'}
        </section>
      `;
    }

    const WORKER_FILTERS = [
      ["all", "All", () => true, "No terminals yet."],
      ["attention", "Attention", view => view.key === "needs-you" || view.key === "failed" || view.key === "waiting", "Nothing needs attention right now."],
      ["running", "Running", view => view.alive, "No terminal is running right now."],
      ["stopped", "Stopped", view => !view.alive && view.key !== "failed", "Every terminal is running."]
    ];

    function renderWorkersTab(d) {
      const workers = d.workers || [];
      const recipes = d.recipes || [];
      const isRecipes = appState.workersView === "recipes";
      const filter = WORKER_FILTERS.find(item => item[0] === appState.workerFilter) || WORKER_FILTERS[0];
      const views = workers.map(w => ({ w, view: workerView(w) }));
      const listed = byUrgency(views.filter(item => filter[2](item.view)).map(item => item.w));
      const chips = WORKER_FILTERS.map(([id, label, test]) => {
        const count = views.filter(item => test(item.view)).length;
        return '<button type="button" class="chip' + (filter[0] === id ? " is-active" : "") + '" aria-pressed="' + (filter[0] === id) + '" onclick="setWorkerFilter(\'' + id + '\')">' + label + " <i>" + count + "</i></button>";
      }).join("");
      let body;
      if (isRecipes) body = renderRecipesView(d);
      else if (!workers.length) body = '<div class="empty tone-idle"><span class="empty-icon">' + icon("moon") + '</span><strong>No terminals yet</strong><p>Terminals you add to this project on your computer show up here.</p></div>';
      else body = '<div class="chips" role="group" aria-label="Show">' + chips + "</div>"
        + (listed.length ? '<div class="list">' + listed.map(terminalCard).join("") + '</div><p class="hint">Tap a terminal for its summary.</p>' : '<div class="empty tone-idle"><span class="empty-icon">' + icon("check") + '</span><strong>Nothing here</strong><p>' + esc(filter[3]) + "</p></div>");
      return `
        <div class="page-head"><h1 class="page-title">${isRecipes ? "Recipes" : "Terminals"}</h1></div>
        <div class="segmented" role="tablist" aria-label="Terminals or recipes">
          <button type="button" role="tab" aria-selected="${!isRecipes}" class="seg ${!isRecipes ? "active" : ""}" onclick="setWorkersView('terminals')">Terminals<b>${workers.length}</b></button>
          <button type="button" role="tab" aria-selected="${isRecipes}" class="seg ${isRecipes ? "active" : ""}" onclick="setWorkersView('recipes')">Recipes<b>${recipes.length}</b></button>
        </div>
        ${canControl() ? "" : noControlNote()}
        ${isRecipes ? '<div class="block" style="margin-top:14px">' + body + "</div>" : body}
      `;
    }

    function renderNeedsTab(d) {
      const attention = attentionOf(d);
      const known = {};
      (d.workers || []).forEach(w => { known[w.id] = w; });
      return `
        <div class="page-head"><div><h1 class="page-title">Needs you${attention.length ? '<span class="count">' + attention.length + "</span>" : ""}</h1><p class="page-sub">Decisions your terminals are waiting on.</p></div></div>
        ${canControl() ? "" : noControlNote()}
        ${attention.length === 0
          ? '<div class="empty tone-ok"><span class="empty-icon">' + icon("check") + '</span><strong>All clear</strong><p>Nothing is waiting on you. When a terminal needs a decision it shows up here, and this phone lets you know.</p></div>'
          : attention.map(item => attentionCard(item, known, false)).join("")}
      `;
    }

    function subpageHead(title, action) {
      return '<button type="button" class="back" onclick="switchTab(\'settings\')"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px;stroke-width:2.2"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg>More</button>'
        + '<div class="page-head" style="margin-top:2px"><h1 class="page-title">' + title + "</h1>" + (action || "") + "</div>";
    }

    function renderMemoryTab(d) {
      const chapters = d.projectMemory?.chapters || [];
      const search = (appState.searchQuery || "").toLowerCase();
      const filtered = chapters.filter(ch => {
        if (!search) return true;
        return (ch.title || "").toLowerCase().includes(search) || (ch.summary || ch.content || "").toLowerCase().includes(search);
      });
      return `
        ${subpageHead("Project memory")}
        <div class="search-box">
          ${icon("search")}
          <input type="search" placeholder="Search memory" aria-label="Search project memory" value="${esc(appState.searchQuery)}" oninput="setSearchQuery(this.value)">
        </div>
        ${filtered.length === 0
          ? '<div class="empty tone-idle"><span class="empty-icon">' + icon("book") + '</span><strong>' + (chapters.length ? "No matches" : "Nothing remembered yet") + "</strong><p>" + (chapters.length ? "Try a different word." : "OUTARCH writes chapters here as the project's sessions come and go.") + "</p></div>"
          : '<div class="list">' + filtered.map(ch => '<div class="memory-chapter"><strong>' + esc(ch.title || ch.id || "Session record") + "</strong><p>" + esc(ch.summary || ch.content || "") + "</p></div>").join("") + "</div>"}
      `;
    }

    const FEED_TONES = { alert: ["tone-danger", "alert"], action: ["tone-info", "check"], system: ["tone-idle", "info"] };
    function renderFeedTab() {
      const items = getFeedItems();
      return `
        ${subpageHead("Activity", items.length ? '<button type="button" class="link" onclick="clearFeed()">Clear</button>' : "")}
        ${items.length === 0
          ? '<div class="empty tone-idle"><span class="empty-icon">' + icon("pulse") + '</span><strong>No activity yet</strong><p>Alerts this phone received and the actions it took are listed here.</p></div>'
          : '<div class="list">' + items.map(item => {
              const tone = FEED_TONES[item.kind] || FEED_TONES.system;
              return '<div class="feed-item"><span class="feed-icon ' + tone[0] + '">' + icon(tone[1]) + '</span><div class="feed-body"><strong>' + esc(item.title) + "</strong><p>" + esc(item.detail) + "</p><small>" + esc(new Date(item.at).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })) + "</small></div></div>";
            }).join("") + "</div>"}
      `;
    }

    function controlSummary() {
      const caps = appState.caps;
      if (!caps) return "Checking with the desktop…";
      if (!caps.canControl) return "Not allowed for this phone. Turn on “Control workers & recipes” on the desktop, then pair again.";
      return caps.autoRun
        ? "Start, restart and recipe runs go straight through. Stop and cancel ask your desktop."
        : "Every request from this phone waits for your approval on the desktop.";
    }

    let deferredPrompt = null;
    function isStandalone() {
      try { return Boolean((window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone); } catch { return false; }
    }
    function installHint() {
      const ua = String(navigator.userAgent || "");
      if (/iPhone|iPad|iPod/i.test(ua)) return "In Safari, tap Share, then Add to Home Screen.";
      if (/Android/i.test(ua)) return "In Chrome, open the ⋮ menu, then Add to Home screen.";
      return "Use your browser's Add to Home Screen option.";
    }

    function capabilityRow(allowed, title, detail) {

    function switchRow(iconName, title, detail, key, on) {

    }

    function renderSettingsTab(cred) {
      const prefs = getPreferences();
      const caps = appState.caps;
      const scopes = Array.isArray(cred.scopes) ? cred.scopes : [];
      const notifSupported = "Notification" in window;
      const secure = window.isSecureContext !== false;
      const notifStatus = notifSupported ? Notification.permission : "unsupported";
      let host = String(cred.endpoint || "");
      try { host = new URL(cred.endpoint).host; } catch {}
      const project = cred.projectName || (appState.data && appState.data.project && appState.data.project.name) || "";
      const canRead = caps ? caps.canReadOutput === true : scopes.indexOf("terminal.read") !== -1;
      const notifDetail = !notifSupported || !secure
        ? "This connection is not https, so the browser keeps alerts inside the app while it is open."
        : notifStatus === "granted" ? "On. New decisions show as notifications." : notifStatus === "denied" ? "Blocked in your browser's site settings." : "Get a notification when a terminal needs you.";
      const notifControl = notifSupported && secure && notifStatus === "default"

      const install = isStandalone()
        ? ""
        : '<section class="group"><h2 class="group-title">Home Screen</h2><div class="list">'

            : '<div class="row has-icon"><span class="row-icon">' + icon("download") + '</span><span class="row-text"><strong>Add to Home Screen</strong><small>' + esc(installHint()) + "</small></span></div>")
          + "</div></section>";
      return `
        <div class="page-head"><h1 class="page-title">More</h1></div>
        <section class="profile">
          <span class="profile-icon">${icon("phone")}</span>
          <div><strong>${esc(cred.deviceName || "This phone")}</strong><small>${project ? "Paired with " + esc(project) + " · " : ""}${esc(host)}</small></div>
        </section>

        <section class="group">
          <h2 class="group-title">This phone can</h2>
          <div class="list">
            ${capabilityRow(scopes.indexOf("workers.read") !== -1 || !scopes.length, "See terminals and what needs you", "Updated live from your computer.")}
            ${capabilityRow(Boolean(caps && caps.canControl), "Start, restart and run recipes", controlSummary())}
            ${capabilityRow(canRead, "Read terminal output", canRead ? "Recent lines, with secrets removed." : "Off. Allow “Terminal Evidence” on the desktop, then pair again.")}
            ${capabilityRow(canAsk(cred), "Ask Mission AI", canAsk(cred) ? "Read-only answers from the desktop's model." : "Off. Allow it on the desktop, then pair again.")}
          </div>
        </section>

        <section class="group">
          <h2 class="group-title">Alerts</h2>
          <div class="list">
            ${switchRow("sound", "Sound", "A short chime when something needs you.", "sound", prefs.sound)}
            ${switchRow("vibrate", "Vibration", "A buzz on alerts and finished actions.", "vibrate", prefs.vibrate)}
            <div class="row has-icon"><span class="row-icon">${icon("bell")}</span><span class="row-text"><strong>Notifications</strong><small>${esc(notifDetail)}</small></span>${notifControl}</div>
          </div>
        </section>

        <section class="group">
          <h2 class="group-title">Project</h2>
          <div class="list">
            <button type="button" class="row has-icon" onclick="switchTab('feed')"><span class="row-icon">${icon("pulse")}</span><span class="row-text"><strong>Activity</strong><small>Alerts and actions on this phone</small></span><span class="chev" aria-hidden="true"></span></button>
            <button type="button" class="row has-icon" onclick="switchTab('memory')"><span class="row-icon">${icon("book")}</span><span class="row-text"><strong>Project memory</strong><small>What OUTARCH remembers about this project</small></span><span class="chev" aria-hidden="true"></span></button>
          </div>

        <section class="group">
          <h2 class="group-title">About</h2>
          <div class="list">

          </div>
        </section>

        ${install}

        <section class="danger-zone">
          <button type="button" class="btn btn-danger btn-lg" onclick="promptUnpair()">${icon("unlink", "width:19px;height:19px")}Unpair this phone</button>
        </section>
        <p class="footnote">Every message is encrypted with a key only this phone and your computer hold (X25519 and AES-256-GCM), and goes straight to your computer, not through OUTARCH's servers.</p>
      `;
    }

    function privacyRow(iconName, title, detail, status) {
      return '<div class="row has-icon"><span class="row-icon">' + icon(iconName) + '</span><span class="row-text"><strong>' + esc(title) + "</strong><small>" + esc(detail) + "</small></span>" + (status ? '<span class="row-end">' + esc(status) + "</span>" : "") + "</div>";
    }
    function renderPrivacyTab() {
      const notifSupported = "Notification" in window;
      const notifStatus = notifSupported ? Notification.permission : "unsupported";
      const notif = notifStatus === "granted" ? "On" : notifStatus === "denied" ? "Blocked" : "Off";
      const prefs = getPreferences();
      return `
        ${subpageHead("Privacy &amp; legal")}
        <section class="group">
          <h2 class="group-title">How this works</h2>
          <div class="list">
            ${privacyRow("lock", "Encrypted to your computer", "Messages go straight to your computer on your network, encrypted with a key only this phone and your computer hold. They do not pass through OUTARCH's servers.")}
            ${privacyRow("sparkle", "Ask Mission AI", "When you ask a question, your computer sends it to the AI provider its Mission AI uses, with read-only tools only.")}
            ${privacyRow("phone", "Stored on this phone", "This phone's pairing key, your alert choices and recent alerts, in this browser's storage for the page. Unpairing deletes the key.")}
          </div>
        </section>
        <section class="group">
          <h2 class="group-title">Permissions</h2>
