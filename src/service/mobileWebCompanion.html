            ${privacyRow("bell", "Notifications", "Alerts from your computer. Only if you turn them on.", notif)}
            ${privacyRow("vibrate", "Vibration", "A buzz on alerts. Turn it off in More.", prefs.vibrate ? "On" : "Off")}
            ${privacyRow("sound", "Sound", "A chime on alerts. Turn it off in More.", prefs.sound ? "On" : "Off")}
            ${privacyRow("x", "Never used", "Camera, microphone, location, contacts, photos and files, reading the clipboard, analytics, advertising, crash reporting and server push.")}
          </div>
        </section>
        <p class="footnote">OUTARCH's full Terms of service, Privacy policy and Mobile companion privacy notice are in the desktop app under Settings, Legal &amp; privacy, and on the OUTARCH website.</p>
      `;
    }

    function setWorkerFilter(f) {
      appState.workerFilter = f;
      renderActiveTab();
    }
    function setSearchQuery(q) {
      appState.searchQuery = q;
      renderActiveTab();
      const input = document.querySelector("#appContainer .search-box input");
      if (input && document.activeElement !== input) {
        input.focus();
        try { input.setSelectionRange(input.value.length, input.value.length); } catch {}
      }
    }
    function clearFeed() { removeStorage(FEED_STORAGE_KEY); renderActiveTab(); }

    function togglePref(key, val) {
      const prefs = getPreferences();
      prefs[key] = val;
      savePreferences(prefs);
      if (key === "sound" && val) SoundFx.beep("info");
      if (key === "vibrate" && val) SoundFx.vibrate([40]);
    }

    async function requestWebNotifications() {
      if (!("Notification" in window)) {
        showToast("This browser cannot show notifications here.", "warning");
        return;
      }
      let perm = "default";
      try { perm = await Notification.requestPermission(); } catch {}
      if (perm === "granted") {
        SoundFx.beep("success");
        showToast("Notifications are on.", "success");
      } else {
        showToast("Notifications stay off. You can change it in the browser's site settings.", "warning");
      }
      appState.lastHtml = "";
      renderActiveTab();
    }

    async function installApp() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch {}
      deferredPrompt = null;
      appState.lastHtml = "";
      renderActiveTab();
    }

    // ---------------------------------------------------------------------------
    // Unpairing: the phone asks the desktop to forget it, then forgets itself
    // ---------------------------------------------------------------------------
    function promptUnpair() {
      appState.confirming = true;
      openActionModal("Unpair this phone?", `
        <div class="confirm">
          <p>Your computer forgets this phone and this phone forgets its key. To use it again, pair it with a new code.</p>
          <div class="confirm-actions">
            <button type="button" class="btn btn-secondary" onclick="closeActionModal()">Cancel</button>
            <button type="button" class="btn btn-danger" id="btnUnpair" onclick="unpairThisPhone()">Unpair</button>
          </div>
        </div>
      `);
    }
    async function unpairThisPhone() {
      const cred = getStoredCredential();
      const button = document.getElementById("btnUnpair");
      if (button) { button.disabled = true; button.textContent = "Unpairing…"; }
      let reached = false;
      if (cred) {
        try { await sendEncryptedRequest(cred, { operation: "unpair" }); reached = true; } catch {}
      }
      closeActionModal();
      appState.ask = { messages: [], busy: false, draft: "" };
      appState.tab = "overview";
      forgetPairing("");
      if (reached) showToast("This phone is unpaired.", "success");
      else showToast("Unpaired here. Your computer could not be reached, so remove this phone there too.", "warning");
    }
    function pairAgain() {
      forgetPairing("");
    }

    // ---------------------------------------------------------------------------
    // Ask Mission AI — read-only answers from the desktop's model
    // ---------------------------------------------------------------------------
    const ASK_SUGGESTIONS = ["What is failing right now?", "Is the dev server up?", "What needs my attention?"];

    function canAsk(cred) {
      return Boolean(cred && Array.isArray(cred.scopes) && cred.scopes.indexOf("assistant.ask") !== -1);
    }

    function inlineMarkup(escaped) {
      const code = escaped.split(TICK);
      let out = "";
      for (let i = 0; i < code.length; i += 1) {
        if (i % 2 === 1 && i < code.length - 1) out += "<code>" + code[i] + "</code>";
        else out += (i % 2 === 1 ? TICK : "") + code[i];
      }
      const bold = out.split("**");
      if (bold.length < 3) return out;
      return bold.map((part, i) => (i % 2 === 1 && i < bold.length - 1) ? "<strong>" + part + "</strong>" : (i % 2 === 1 ? "**" + part : part)).join("");
    }

    function formatAnswer(text) {
      const fence = TICK + TICK + TICK;
      const segments = String(text == null ? "" : text).split(fence);
      let html = "";
      segments.forEach((segment, index) => {
        if (index % 2 === 1 && index < segments.length - 1) {
          const lines = segment.split(NL);
          if (lines.length > 1 && lines[0].trim().length < 20 && lines[0].trim().indexOf(" ") === -1) lines.shift();
          html += '<pre class="ask-code">' + esc(lines.join(NL).trim()) + "</pre>";
          return;
        }
        let paragraph = [];
        let list = [];
        const flushParagraph = () => { if (paragraph.length) { html += "<p>" + paragraph.map(line => inlineMarkup(esc(line))).join("<br>") + "</p>"; paragraph = []; } };
        const flushList = () => { if (list.length) { html += "<ul>" + list.map(item => "<li>" + inlineMarkup(esc(item)) + "</li>").join("") + "</ul>"; list = []; } };
        segment.split(NL).forEach(raw => {
          const line = raw.trim();
          if (!line) { flushParagraph(); flushList(); return; }
          if (line.indexOf("- ") === 0 || line.indexOf("* ") === 0) { flushParagraph(); list.push(line.slice(2)); return; }
          flushList();
          paragraph.push(line.replace(/^#+ /, ""));
        });
        flushParagraph();
        flushList();
      });
      return html;
    }

    function renderAskThread(ask) {
      if (!ask.messages.length && !ask.busy) {
        return '<div class="ask-empty"><span class="ai-mark">' + icon("sparkle") + '</span><strong>Ask about this project</strong><p>Mission AI reads what your terminals printed and answers here. It only looks; starting or stopping happens in Terminals.</p><div class="ask-suggestions">'
          + ASK_SUGGESTIONS.map(question => '<button type="button" data-q="' + esc(question) + '" onclick="askSuggestion(this.dataset.q)">' + esc(question) + "</button>").join("")
          + "</div></div>";
      }
      return ask.messages.map(message => {
        if (message.role === "user") return '<div class="ask-msg ask-msg--user">' + esc(message.text) + "</div>";
        const meta = [message.model, (message.looked || []).join(" · ")].filter(Boolean).join(" · ");
        return '<div class="ask-msg ask-msg--ai">'
          + (message.error ? '<p class="ask-error">' + esc(message.error) + "</p>" : formatAnswer(message.text))
          + (meta ? '<small class="ask-meta">' + esc(meta) + "</small>" : "")
          + "</div>";
      }).join("") + (ask.busy ? '<div class="ask-msg ask-msg--ai ask-msg--busy"><span class="ask-dots" aria-hidden="true"><i></i><i></i><i></i></span>Looking at the project…</div>' : "");
    }

    function renderAskTab(container, cred) {
      if (!canAsk(cred)) {
        container.innerHTML = '<div class="empty tone-ai" style="margin-top:16px"><span class="empty-icon">' + icon("sparkle") + '</span><strong>Ask Mission AI is off</strong><p>This phone was paired without permission to ask Mission AI. On the desktop, turn on Ask Mission AI under Integrations, Mobile Companion, then pair this phone again.</p></div>';
        return;
      }
      let thread = document.getElementById("askThread");
      if (!thread || typeof container.contains !== "function" || !container.contains(thread)) {
        container.innerHTML = '<section class="ask"><div class="ask-thread" id="askThread" aria-live="polite"></div><form class="ask-composer" onsubmit="submitAsk(event)"><textarea id="askInput" rows="1" maxlength="2000" placeholder="Ask about this project…" aria-label="Question for Mission AI" oninput="rememberAskDraft(this.value)" onkeydown="askKey(event)"></textarea><button type="submit" class="ask-send" id="askSend" aria-label="Send">' + icon("send", "width:21px;height:21px;stroke-width:2.2") + "</button></form></section>";
        thread = document.getElementById("askThread");
        const input = document.getElementById("askInput");
        if (input) input.value = appState.ask.draft || "";
      }
      const html = renderAskThread(appState.ask);
      if (thread.innerHTML !== html) {
        thread.innerHTML = html;
        if (appState.ask.messages.length) {
          try { window.scrollTo(0, document.body.scrollHeight); } catch {}
        }
      }
      const send = document.getElementById("askSend");
      if (send) send.disabled = appState.ask.busy;
    }

    function rememberAskDraft(value) {
      appState.ask.draft = String(value || "");
      const input = document.getElementById("askInput");
      if (input && input.style && input.scrollHeight !== undefined) {
        input.style.height = "auto";
        input.style.height = Math.min(132, input.scrollHeight) + "px";
      }
    }
    function askKey(event) {
      // Enter sends on a hardware keyboard; Shift+Enter makes a new line.
      if (event && event.key === "Enter" && !event.shiftKey && !event.isComposing && window.matchMedia && window.matchMedia("(hover: hover)").matches) {
        event.preventDefault();
        submitAsk();
      }
    }

    async function submitAsk(event) {
      if (event && typeof event.preventDefault === "function") event.preventDefault();
      const cred = getStoredCredential();
      const ask = appState.ask;
      const input = document.getElementById("askInput");
      const text = String((input && input.value) || ask.draft || "").trim();
      if (!text || ask.busy || !canAsk(cred)) return;
      const history = ask.messages.filter(message => !message.error && message.text).slice(-8).map(message => ({ role: message.role, text: message.text }));
      ask.messages.push({ role: "user", text: text });
      ask.draft = "";
      if (input) { input.value = ""; if (input.style) input.style.height = ""; }
      ask.busy = true;
      renderActiveTab();
      try {
        const result = await sendEncryptedRequest(cred, { operation: "ask", text: text, history: history });
        ask.messages.push({ role: "assistant", text: String((result && result.text) || ""), looked: (result && Array.isArray(result.looked)) ? result.looked : [], model: result && result.model ? String(result.model.label || "") : "" });
      } catch (error) {
        ask.messages.push({ role: "assistant", text: "", error: (error && error.message) || "Mission AI could not answer." });
      } finally {
        ask.busy = false;
        if (ask.messages.length > 40) ask.messages.splice(0, ask.messages.length - 40);
        if (appState.tab === "ask") renderActiveTab();
      }
    }

    function askSuggestion(question) {
      appState.ask.draft = String(question || "");
      const input = document.getElementById("askInput");
      if (input) input.value = appState.ask.draft;
      submitAsk();
    }

    // ---------------------------------------------------------------------------
    // Painting the current tab
    // ---------------------------------------------------------------------------
    function renderWaiting() {
      if (appState.error) {
        const info = errorInfo(appState.error);
        return `
          <div class="state tone-${info.tone}">
            <span class="state-icon">${icon(info.icon)}</span>
            <h1>${esc(info.title)}</h1>
            <p>${esc(info.body)}</p>
            <div class="state-actions">
              <button type="button" class="btn btn-primary btn-lg" onclick="refreshDashboard(true)">Try again</button>
              <button type="button" class="btn btn-lg" onclick="pairAgain()">Pair again</button>
            </div>
          </div>
        `;
      }
      return '<div aria-busy="true"><div class="skel skel-hero"></div><div class="skel-row"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div><div class="skel skel-list"></div><p class="skel-caption">Connecting to your computer…</p></div>';
    }

    function syncAskTab(cred) {
      const askTab = document.getElementById("navTabAsk");
      const allowed = canAsk(cred);
      if (askTab && askTab.hidden !== !allowed) askTab.hidden = !allowed;
      if (!allowed && appState.tab === "ask") appState.tab = "overview";
    }

    function renderActiveTab(fresh) {
      const container = document.getElementById("appContainer");
      const cred = getStoredCredential();
      if (!cred) {
        renderPairForm();
        return;
      }
      syncAskTab(cred);
      if (appState.tab === "ask") {
        renderAskTab(container, cred);
        if (fresh) playEnter(container);
        return;
      }
      const d = appState.data;
      let content = "";
      if (!d) content = renderWaiting();
      else if (appState.tab === "overview") content = renderOverviewTab(d);
      else if (appState.tab === "workers") content = renderWorkersTab(d);
      else if (appState.tab === "needs") content = renderNeedsTab(d);
      else if (appState.tab === "memory") content = renderMemoryTab(d);
      else if (appState.tab === "feed") content = renderFeedTab();
      else if (appState.tab === "privacy") content = renderPrivacyTab();
      else if (appState.tab === "settings") content = renderSettingsTab(cred);

      if (appState.lastHtml === content) return;
      const active = document.activeElement;
      const searching = Boolean(active && active.closest && active.closest(".search-box"));
      appState.lastHtml = content;
      if (fresh) {
        container.innerHTML = content;
        playEnter(container);
      } else {
        patchHtml(container, content);
      }
      if (searching) {
        const input = document.querySelector("#appContainer .search-box input");
        if (input && document.activeElement !== input) {
          input.focus();
          try { input.setSelectionRange(input.value.length, input.value.length); } catch {}
        }
      }
    }

    // ---------------------------------------------------------------------------
    // Pairing screen
    // ---------------------------------------------------------------------------
    function updatePinSlots(val, typed) {
      const digits = String(val || "").replace(/[^0-9]/g, "").slice(0, 6);
      const input = document.getElementById("pairCode");
      if (input && input.value !== digits) input.value = digits;
      for (let i = 0; i < 6; i++) {
        const slot = document.getElementById("slot" + i);
        if (!slot) continue;
        slot.className = "pin-slot";
        if (i < digits.length) {
          slot.textContent = digits[i];
          slot.classList.add("is-filled");
        } else if (i === digits.length) {
          slot.innerHTML = '<span class="pin-caret"></span>';
          slot.classList.add("is-focused");
        } else {
          slot.textContent = "";
        }
      }
      const button = document.getElementById("pairBtn");
      if (button && !isPairing) button.disabled = digits.length !== 6;
      if (typed) {
        const msg = document.getElementById("pairMsg");
        if (msg && msg.textContent) { msg.className = "msg pair-msg"; msg.textContent = ""; }
      }
      // Typing the sixth digit pairs at once. A code that came in the link
      // waits for a tap, so the phone's name can be checked first.
      if (typed && digits.length === 6) setTimeout(() => handlePair(), 180);
    }
    function pinFocus(on) {
      const row = document.getElementById("pinSlotsRow");
      if (row && row.classList) row.classList.toggle("has-focus", Boolean(on));
    }

    function defaultDeviceName() {
      const ua = String(navigator.userAgent || "");
      if (/iPad/i.test(ua)) return "iPad";
      if (/iPhone|iPod/i.test(ua)) return "iPhone";
      if (/Android/i.test(ua)) return /Mobile/i.test(ua) ? "Android phone" : "Android tablet";
      if (/Macintosh/i.test(ua)) return "Mac";
      if (/Windows/i.test(ua)) return "Windows PC";
      return "Phone";
    }

    function renderPairForm() {
      document.body && document.body.classList.remove("is-paired");
      const hashParams = new URLSearchParams((window.location.hash || "").replace(/^#/, ""));
      const queryParams = new URLSearchParams(window.location.search);
      const defaultCode = String(hashParams.get("code") || queryParams.get("code") || "").replace(/[^0-9]/g, "").slice(0, 6);
      if ((window.location.hash || window.location.search) && window.history && window.history.replaceState) {
        window.history.replaceState(null, "", window.location.pathname);
      }
      const container = document.getElementById("appContainer");
      const sub = document.getElementById("headerSubtitle");
      if (sub) sub.textContent = "Mobile companion";
      appState.lastHtml = "";
      const notice = appState.pairNotice
        ? '<div class="pair-notice" role="status">' + icon("info", "width:18px;height:18px;margin-top:1px") + "<span>" + esc(appState.pairNotice) + "</span></div>"
        : "";

      container.innerHTML = `
        <section class="pair">
          <span class="pair-mark" aria-hidden="true"></span>
          <h1>Pair this phone</h1>
          <p class="pair-lede">Enter the 6-digit code shown on your computer in <b>OUTARCH → Integrations → Mobile Companion</b>.</p>
          ${notice}
          <label class="pin-label" for="pairCode"><span>Pairing code</span></label>
          <div class="pin-slots-row" id="pinSlotsRow">
            <div class="pin-slot is-focused" id="slot0"><span class="pin-caret"></span></div>
            <div class="pin-slot" id="slot1"></div>
            <div class="pin-slot" id="slot2"></div>
            <div class="pin-slot" id="slot3"></div>
            <div class="pin-slot" id="slot4"></div>
            <div class="pin-slot" id="slot5"></div>
            <input id="pairCode" class="invisible-otp-input" type="text" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" aria-label="6-digit pairing code" value="${esc(defaultCode)}" oninput="updatePinSlots(this.value, true)" onfocus="pinFocus(true)" onblur="pinFocus(false)">
          </div>
          <div class="field">
            <label for="pairName">Name for this phone</label>
            <input id="pairName" type="text" maxlength="60" autocomplete="off" value="${esc(defaultDeviceName())}">
          </div>
          <button type="button" id="pairBtn" class="btn btn-primary btn-lg btn-block" onclick="handlePair()" ${defaultCode.length === 6 ? "" : "disabled"}>Pair this phone</button>
          <p id="pairMsg" class="msg pair-msg" role="status">${defaultCode.length === 6 ? "The code came with the link. Check it matches your computer, then tap Pair." : ""}</p>
          <p class="pair-trust">${icon("lock")}End-to-end encrypted. Stays on your Wi-Fi.</p>
          <details class="pair-help">
            <summary>Where do I find the code?</summary>
            <ol>
              <li>On your computer, open <b>OUTARCH</b>.</li>
              <li>Go to <b>Integrations</b>, then <b>Mobile Companion</b>, and turn it on.</li>
              <li>Scan the QR code with this phone's camera, or type the 6 digits here. A code works once and lasts 5 minutes.</li>
              <li>This phone and your computer must be on the same Wi-Fi.</li>
            </ol>
          </details>
        </section>
      `;
      if (defaultCode) updatePinSlots(defaultCode, false);
    }

    async function handlePair() {
      const code = (document.getElementById("pairCode")?.value || "").replace(/[^0-9]/g, "");
      const name = (document.getElementById("pairName")?.value || "").trim() || defaultDeviceName();
      const btn = document.getElementById("pairBtn");
      const msg = document.getElementById("pairMsg");
      if (isPairing) return;

      if (code.length !== 6) {
        if (msg) {
          msg.className = "msg pair-msg error";
          msg.textContent = "Enter the 6-digit code shown on your computer.";
        }
        for (let i = 0; i < 6; i++) {
          const slot = document.getElementById("slot" + i);
          if (slot) slot.classList.add("is-error");
        }
        setTimeout(() => updatePinSlots(code, false), 700);
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spin" aria-hidden="true"></span>Pairing…';
      }
      if (msg) {
        msg.className = "msg pair-msg";
        msg.textContent = "Making a secure link with your computer…";
      }

      try {
        await pairWithDesktop(code, name);
        if (btn) btn.innerHTML = icon("check", "width:20px;height:20px;stroke-width:2.4") + "Paired";
        if (msg) msg.textContent = "";
        appState.pairNotice = "";
        appState.tab = "overview";
        setTimeout(() => {
          render();
          showToast("Paired. This phone now follows your project.", "success");
        }, 450);
      } catch (err) {
        if (msg) {
          msg.className = "msg pair-msg error";
          msg.textContent = (err && err.message) || "Pairing failed. Try again.";
        }
        for (let i = 0; i < 6; i++) {
          const slot = document.getElementById("slot" + i);
          if (slot) slot.classList.add("is-error");
        }
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Pair this phone";
        }
      }
    }

    // ---------------------------------------------------------------------------
    // Start-up, polling and the page's own lifecycle
    // ---------------------------------------------------------------------------
    function stopPolling() {
      if (appState.pollTimer) {
        clearInterval(appState.pollTimer);
        appState.pollTimer = null;
      }
    }
    function startPolling() {
      if (!appState.pollTimer) appState.pollTimer = setInterval(refreshDashboard, POLL_MS);
    }
    function pageHidden() {
      return typeof document.visibilityState === "string" && document.visibilityState === "hidden";
    }

    function render() {
      appState.lastHtml = "";
      stopPolling();
      if (appState.sse) {
        appState.sse.close();
        appState.sse = null;
      }
      const cred = getStoredCredential();
      if (!cred) {
        renderPairForm();
        const banner = document.getElementById("banner");
        if (banner) banner.hidden = true;
        updateBadges();
        return;
      }
      if (document.body) document.body.classList.add("is-paired");
      setHeaderProject(cred.projectName || "Mobile companion");
      setConnection(appState.data ? "live" : "connecting");
      syncTabs();
      renderActiveTab(true);
      refreshDashboard();
      connectSSE();
      if (!pageHidden()) startPolling();
    }

    // A phone in a pocket should not keep polling; coming back refreshes at once.
    document.addEventListener("visibilitychange", () => {
      if (!getStoredCredential()) return;
      if (pageHidden()) stopPolling();
      else { startPolling(); refreshDashboard(); }
    });

    window.addEventListener("scroll", () => {
      const bar = document.getElementById("appbar");
      if (bar && bar.classList) bar.classList.toggle("is-scrolled", (window.scrollY || 0) > 4);
    }, { passive: true });

    // Keyboard use in a desktop browser.
    window.addEventListener("keydown", e => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
        if (e.key === "Escape") {
          closeActionModal();
          e.target.blur();
        }
        return;
      }
      if (e.key === "Escape") {
        closeActionModal();
        return;
      }
      if (!getStoredCredential() || e.metaKey || e.ctrlKey || e.altKey) return;
      const tabs = { 1: "overview", 2: "workers", 3: "needs", 4: "ask", 5: "settings" };
      const tab = tabs[e.key];
      if (!tab) return;
      if (tab === "ask" && !canAsk(getStoredCredential())) return;
      switchTab(tab);
    });

    wireSheetDrag();

    // PWA Service Worker Registration
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/mobile/sw.js", { scope: "/mobile" }).catch(() => {});
      });
    }

    // Install prompt (only offered on a secure connection by the browser).
    window.addEventListener("beforeinstallprompt", e => {
      e.preventDefault();
      deferredPrompt = e;
      if (appState.tab === "settings") { appState.lastHtml = ""; renderActiveTab(); }
    });

    render();
  </script>
</body>
</html>
